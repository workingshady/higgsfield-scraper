<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="490" viewBox="0 0 1280 490" role="img" aria-labelledby="st sd">
<title id="st">higgsfield-scraper — the 10 scrapers</title>
<desc id="sd">Ten scrapers and what each collects: pricing (default): plans · offers · renewals, credit cost of every model, benefits · compare · copy; community (public): gallery generations + prompts, shots · posts · creators, comments · cost estimate; catalog (public): motions · avatars · voices, styles · viral presets, chain · restyle · outfits; projects (public): films · contests · entries, assets · briefs · comments, trending · user works; blog (public): blog · talent posts, help centers · case studies, changelog (full text); site (public): apps · academy (+ JSON API), MCP skills · original series, landings · rooms · promos; showcase (public): Canvas · Editing Room, video explore · effects, reels · main feed · API docs; studios (opt-in): apps · games · skills, AI employees · playable ads, studio galleries + comments; models (opt-in): JS model registry per build, params · enums · limits, gating · plans · costs; account (login): your plan · balances, your jobs + real credits, estimate vs actual. Then export, merge_generations, diff and the interactive menu.</desc>
<rect width="1280" height="490" rx="18" fill="#0f1113"/>
<text x="32" y="44" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">higgsfield-scraper <tspan fill="#d1fe17">·</tspan> 10 scrapers</text>
<text x="34" y="66" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6e757e"><tspan fill="#d1fe17">default</tspan> = what <tspan font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">scrape</tspan> runs · <tspan fill="#a7adb5">public</tspan> = no login · <tspan fill="#9ce6f3">opt-in</tspan> = public, run by name · <tspan fill="#ff005b">login</tspan> = your own account only. Every scraper has more opt-in options (CLI.md).</text>
