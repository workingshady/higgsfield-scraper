<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">higgsfield-scraper (unofficial)</title>
  <desc id="desc">Unofficial, reverse-engineered Scrapy scrapers for public Higgsfield.ai data, 10 scrapers: pricing, community, catalog, projects, blog, site (apps, academy, MCP), showcase, studios (marketplaces, studio galleries), models (JS model registry), account; cost estimates, export to datasets, cross-run dedupe, interactive menu.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0f1113" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.86" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#d1fe17" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d1fe17" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" rx="20" fill="#f5f6f1"/>
  <rect width="1280" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="20" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="318.5" rx="19.5" fill="none" stroke="#dfe2da" stroke-width="1.5"/>

  <rect x="64" y="44" width="118" height="26" rx="13" fill="none" stroke="#d6004c" stroke-width="1.5"/>
  <text x="123" y="62" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5" fill="#d6004c">UNOFFICIAL</text>
  <text x="196" y="62" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#7b828b">REVERSE-ENGINEERED · SCRAPY · PYDANTIC</text>

  <text x="62" y="132" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-2" fill="#0f1113">higgsfield<tspan fill="#5f7311">-scraper</tspan></text>
  <text x="64" y="172" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="22" fill="#4a5058">Every public Higgsfield.ai dataset — validated, organized, exported.</text>
  <rect x="64" y="184" width="64" height="4" rx="2" fill="#d1fe17"/>
