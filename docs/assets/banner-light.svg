  <text x="64" y="298" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7b828b"><tspan fill="#5f7311">$</tspan> python -m higgsfield_scraper menu<tspan dx="18" fill="#7b828b"># or: scrape &lt;scraper&gt; · export · diff</tspan></text>

