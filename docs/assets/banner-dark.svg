<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">higgsfield-scraper (unofficial)</title>
  <desc id="desc">Unofficial, reverse-engineered Scrapy scrapers for public Higgsfield.ai data: pricing, community, catalog, projects, blog, site (apps, academy, MCP); cost estimates, interactive menu.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.86" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#d1fe17" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d1fe17" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" rx="20" fill="#0f1113"/>
  <rect width="1280" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="20" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="318.5" rx="19.5" fill="none" stroke="#2a2d31" stroke-width="1.5"/>

  <rect x="64" y="44" width="118" height="26" rx="13" fill="none" stroke="#ff005b" stroke-width="1.5"/>
  <text x="123" y="62" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5" fill="#ff005b">UNOFFICIAL</text>
  <text x="196" y="62" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#6e757e">REVERSE-ENGINEERED · SCRAPY · PYDANTIC</text>

  <text x="62" y="140" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-2" fill="#ffffff">higgsfield<tspan fill="#d1fe17">-scraper</tspan></text>
  <text x="64" y="184" font-family="Inter, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="22" fill="#a7adb5">Every public Higgsfield.ai dataset — validated, organized, exported.</text>
  <rect x="64" y="200" width="64" height="4" rx="2" fill="#d1fe17"/>
  <rect x="64" y="226" width="104" height="34" rx="17" fill="#d1fe17" stroke="#d1fe17" stroke-width="1.5"/><text x="116.0" y="248" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#0f1113">pricing</text><rect x="178" y="226" width="132" height="34" rx="17" fill="#16181b" stroke="#2a2d31" stroke-width="1.5"/><text x="244.0" y="248" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#ffffff">community</text><rect x="320" y="226" width="110" height="34" rx="17" fill="#16181b" stroke="#2a2d31" stroke-width="1.5"/><text x="375.0" y="248" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#ffffff">catalog</text><rect x="440" y="226" width="112" height="34" rx="17" fill="#16181b" stroke="#2a2d31" stroke-width="1.5"/><text x="496.0" y="248" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#ffffff">projects</text><rect x="562" y="226" width="78" height="34" rx="17" fill="#16181b" stroke="#2a2d31" stroke-width="1.5"/><text x="601.0" y="248" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#ffffff">blog</text><rect x="650" y="226" width="72" height="34" rx="17" fill="#16181b" stroke="#2a2d31" stroke-width="1.5"/><text x="686.0" y="248" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#ffffff">site</text>
  <text x="64" y="294" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#6e757e"><tspan fill="#d1fe17">$</tspan> python -m higgsfield_scraper menu<tspan dx="18" fill="#6e757e"># or: scrape &lt;scraper&gt; · diff · crosscheck</tspan></text>

  <rect x="820" y="64" width="150" height="30" rx="8" fill="#16181b" stroke="#2a2d31"/><text x="895" y="84" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a7adb5">/plans</text><path d="M970 79 C 1020 79, 1030 133, 1068 133" fill="none" stroke="#d1fe17" stroke-width="2" stroke-opacity="0.85"/><rect x="820" y="118" width="150" height="30" rx="8" fill="#16181b" stroke="#2a2d31"/><text x="895" y="138" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a7adb5">/job-sets/costs</text><path d="M970 133 C 1020 133, 1030 133, 1068 133" fill="none" stroke="#d1fe17" stroke-width="2" stroke-opacity="0.85"/><rect x="820" y="172" width="150" height="30" rx="8" fill="#16181b" stroke="#2a2d31"/><text x="895" y="192" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a7adb5">/publications</text><path d="M970 187 C 1020 187, 1030 133, 1068 133" fill="none" stroke="#d1fe17" stroke-width="2" stroke-opacity="0.85"/>
  <circle cx="1084" cy="133" r="17" fill="#d1fe17"/>
  <path d="M1076 133 l6 6 l11 -12" fill="none" stroke="#0f1113" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1100 133 C 1130 133, 1140 79, 1170 79" fill="none" stroke="#9ce6f3" stroke-width="2"/><rect x="1170" y="64" width="70" height="30" rx="8" fill="#16181b" stroke="#9ce6f3"/><text x="1205" y="84" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#ffffff">JSON</text><path d="M1100 133 C 1130 133, 1140 133, 1170 133" fill="none" stroke="#9ce6f3" stroke-width="2"/><rect x="1170" y="118" width="70" height="30" rx="8" fill="#16181b" stroke="#9ce6f3"/><text x="1205" y="138" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#ffffff">CSV</text><path d="M1100 133 C 1130 133, 1140 187, 1170 187" fill="none" stroke="#9ce6f3" stroke-width="2"/><rect x="1170" y="172" width="70" height="30" rx="8" fill="#16181b" stroke="#9ce6f3"/><text x="1205" y="192" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#ffffff">HAR</text>
  <text x="1084" y="236" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6e757e">validate · dedup · export</text>
</svg>
