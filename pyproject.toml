[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "higgs-price"
version = "0.1.0"
description = "Scrapy scraper for Higgsfield.ai plans, offers and per-model credit costs (USD)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scrapy>=2.13",
    "pydantic>=2.7",
    "itemadapter>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "genson>=1.3"]

[project.scripts]
higgs-price = "higgs_price.cli:main"

[tool.setuptools.packages.find]
include = ["higgs_price*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
